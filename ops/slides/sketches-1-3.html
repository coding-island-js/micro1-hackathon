<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sketches 1-3</title>
<style>
  body { margin:0; background:#efeae0; font-family:"Comic Sans MS","Trebuchet MS",sans-serif; }
  .sheet { width:1100px; margin:0 auto; padding:26px 0 40px; }
  .panel { background:#fdfbf5; border:3px solid #1a1a1a; border-radius:4px;
           margin-bottom:26px; padding:0 0 18px; }
  .cap { font-size:30px; font-weight:bold; color:#1a1a1a; padding:6px 30px 0; line-height:1.3; }
  .cap b { color:#c1121f; }
  .num { position:relative; top:14px; left:26px; font-size:20px; color:#8a8378; }
  svg { display:block; }
  text { font-family:"Comic Sans MS","Trebuchet MS",sans-serif; }
</style>
</head>
<body>
<div class="sheet">

<!-- PANEL 1 -->
<div class="panel">
  <div class="num">1</div>
  <svg viewBox="0 0 1040 300" width="1040" height="300">
    <g stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round">
      <!-- desk -->
      <path d="M120 250 h340"/>
      <path d="M160 250 v34"/><path d="M420 250 v34"/>
      <!-- person -->
      <circle cx="250" cy="150" r="34" fill="#fdfbf5"/>
      <path d="M250 184 v50"/>
      <path d="M250 200 l-38 26"/><path d="M250 200 l38 26"/>
      <!-- laptop -->
      <path d="M300 250 l30 -46 h96 l14 46 z" fill="#fdfbf5"/>
      <!-- empty chairs, crossed out -->
      <path d="M640 250 h90 v-70" opacity=".45"/>
      <path d="M820 250 h90 v-70" opacity=".45"/>
    </g>
    <g stroke="#c1121f" stroke-width="5" stroke-linecap="round">
      <path d="M636 176 l100 84"/><path d="M736 176 l-100 84"/>
      <path d="M816 176 l100 84"/><path d="M916 176 l-100 84"/>
    </g>
    <text x="238" y="158" font-size="26" fill="#1a1a1a" text-anchor="middle">me</text>
    <text x="686" y="292" font-size="21" fill="#8a8378" text-anchor="middle">no other developer</text>
    <text x="866" y="292" font-size="21" fill="#8a8378" text-anchor="middle">no tester</text>
  </svg>
  <div class="cap">I build apps on my own. <b>Nobody checks my work.</b></div>
</div>

<!-- PANEL 2 -->
<div class="panel">
  <div class="num">2</div>
  <svg viewBox="0 0 1040 320" width="1040" height="320">
    <g stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round">
      <!-- stranger with laptop -->
      <circle cx="150" cy="120" r="32" fill="#fdfbf5"/>
      <path d="M150 152 v46"/><path d="M150 166 l-34 24"/><path d="M150 166 l34 24"/>
      <path d="M196 214 l26 -40 h84 l12 40 z" fill="#fdfbf5"/>
      <!-- arrow -->
      <path d="M350 190 h150" stroke-width="5"/>
      <path d="M478 172 l24 18 l-24 18" stroke-width="5"/>
      <!-- account box -->
      <rect x="530" y="112" width="220" height="150" rx="10" fill="#fdfbf5"/>
      <!-- customer, unaware -->
      <circle cx="900" cy="150" r="34" fill="#fdfbf5"/>
      <path d="M900 184 v50"/><path d="M900 200 l-36 26"/><path d="M900 200 l36 26"/>
    </g>
    <text x="150" y="72" font-size="21" fill="#1a1a1a" text-anchor="middle">a stranger</text>
    <text x="640" y="164" font-size="22" fill="#1a1a1a" text-anchor="middle">customer account</text>
    <text x="640" y="202" font-size="24" fill="#c1121f" text-anchor="middle" font-weight="bold">password</text>
    <text x="640" y="234" font-size="24" fill="#c1121f" text-anchor="middle" font-weight="bold">CHANGED</text>
    <text x="900" y="286" font-size="21" fill="#8a8378" text-anchor="middle">the customer</text>
    <g stroke="#8a8378" stroke-width="3" fill="none" stroke-dasharray="9 9">
      <path d="M760 188 h94"/>
    </g>
    <text x="808" y="112" font-size="46" fill="#8a8378" text-anchor="middle">?</text>
  </svg>
  <div class="cap">A stranger changed a customer's password. <b>The customer was never told.</b></div>
</div>

<!-- PANEL 3 -->
<div class="panel">
  <div class="num">3</div>
  <svg viewBox="0 0 1040 320" width="1040" height="320">
    <g stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round">
      <!-- robot 1 with code -->
      <rect x="90" y="110" width="150" height="130" rx="18" fill="#fdfbf5"/>
      <circle cx="132" cy="158" r="11" fill="#1a1a1a"/><circle cx="198" cy="158" r="11" fill="#1a1a1a"/>
      <path d="M136 196 q30 20 60 0"/>
      <path d="M165 110 v-24"/><circle cx="165" cy="80" r="8" fill="#1a1a1a"/>
      <!-- paper -->
      <rect x="330" y="96" width="170" height="170" rx="6" fill="#fdfbf5"/>
      <path d="M356 136 h120"/><path d="M356 168 h120"/><path d="M356 200 h86"/>
      <!-- robot 2, magnifier -->
      <rect x="620" y="110" width="150" height="130" rx="18" fill="#fdfbf5"/>
      <circle cx="662" cy="158" r="11" fill="#1a1a1a"/><circle cx="728" cy="158" r="11" fill="#1a1a1a"/>
      <path d="M666 204 q30 -18 60 0"/>
      <path d="M695 110 v-24"/><circle cx="695" cy="80" r="8" fill="#1a1a1a"/>
      <circle cx="556" cy="176" r="42"/>
      <path d="M586 208 l38 38"/>
    </g>
    <text x="165" y="278" font-size="21" fill="#8a8378" text-anchor="middle">AI number one wrote this</text>
    <text x="695" y="278" font-size="21" fill="#8a8378" text-anchor="middle">AI number two reads it</text>
    <g>
      <rect x="828" y="126" width="176" height="72" rx="12" fill="#fdfbf5" stroke="#c1121f" stroke-width="4"/>
      <text x="916" y="156" font-size="22" fill="#c1121f" text-anchor="middle" font-weight="bold">CANNOT</text>
      <text x="916" y="184" font-size="22" fill="#c1121f" text-anchor="middle" font-weight="bold">TOUCH</text>
    </g>
  </svg>
  <div class="cap">So I built a second AI. The second AI hunts for mistakes. <b>The second AI cannot change anything.</b></div>
</div>

</div>
</body>
</html>
