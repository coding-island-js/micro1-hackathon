<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panel test</title>
<style>
  body { margin:0; background:#f7f3ea; font-family:"Trebuchet MS",system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .slide { width:1280px; height:720px; background:#fffdf7; position:relative;
           box-shadow:0 12px 40px rgba(0,0,0,.12); border-radius:8px; overflow:hidden; }
  .line { position:absolute; left:64px; bottom:56px; right:64px;
          font-size:46px; line-height:1.25; font-weight:700; color:#1d1b16; }
  .line em { font-style:normal; color:#c1121f; }
</style>
</head>
<body>
<div class="slide">
<svg viewBox="0 0 1280 500" width="1280" height="500">
  <!-- robot -->
  <g transform="translate(150,90)">
    <rect x="30" y="70" width="170" height="150" rx="26" fill="#7fb2c4" stroke="#1d1b16" stroke-width="7"/>
    <rect x="70" y="10" width="90" height="26" rx="13" fill="#1d1b16"/>
    <line x1="115" y1="36" x2="115" y2="70" stroke="#1d1b16" stroke-width="7"/>
    <circle cx="88" cy="128" r="15" fill="#fffdf7" stroke="#1d1b16" stroke-width="6"/>
    <circle cx="146" cy="128" r="15" fill="#fffdf7" stroke="#1d1b16" stroke-width="6"/>
    <circle cx="88" cy="130" r="6" fill="#1d1b16"/>
    <circle cx="146" cy="130" r="6" fill="#1d1b16"/>
    <path d="M92 172 q26 22 52 0" stroke="#1d1b16" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="72" y="222" width="42" height="70" rx="14" fill="#7fb2c4" stroke="#1d1b16" stroke-width="7"/>
    <rect x="128" y="222" width="42" height="70" rx="14" fill="#7fb2c4" stroke="#1d1b16" stroke-width="7"/>
    <!-- arm holding sign -->
    <path d="M200 130 q70 -10 96 -46" stroke="#1d1b16" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- sign -->
  <g transform="translate(430,60)">
    <rect x="0" y="0" width="300" height="120" rx="16" fill="#2f9e6d" stroke="#1d1b16" stroke-width="7"/>
    <text x="150" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#fffdf7"
          font-family="Trebuchet MS, sans-serif">ALL DONE!</text>
    <text x="150" y="92" text-anchor="middle" font-size="26" fill="#fffdf7"
          font-family="Trebuchet MS, sans-serif">Every test passed</text>
  </g>

  <!-- receipt behind -->
  <g transform="translate(830,60)">
    <path d="M0 0 h300 v330 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 l-25 -18 l-25 18 z"
          fill="#fffdf7" stroke="#1d1b16" stroke-width="7"/>
    <text x="34" y="60" font-size="27" font-weight="700" fill="#1d1b16" font-family="Trebuchet MS, sans-serif">RECEIPT</text>
    <line x1="34" y1="78" x2="266" y2="78" stroke="#1d1b16" stroke-width="4"/>
    <text x="34" y="128" font-size="27" fill="#1d1b16" font-family="Trebuchet MS, sans-serif">Your order</text>
    <text x="266" y="128" text-anchor="end" font-size="27" fill="#1d1b16" font-family="Trebuchet MS, sans-serif">$89</text>
    <text x="34" y="176" font-size="27" fill="#c1121f" font-family="Trebuchet MS, sans-serif">Your order</text>
    <text x="266" y="176" text-anchor="end" font-size="27" fill="#c1121f" font-family="Trebuchet MS, sans-serif">$89</text>
    <text x="34" y="196" font-size="20" fill="#c1121f" font-family="Trebuchet MS, sans-serif">(again?!)</text>
    <line x1="34" y1="222" x2="266" y2="222" stroke="#1d1b16" stroke-width="4"/>
    <text x="34" y="266" font-size="31" font-weight="700" fill="#c1121f" font-family="Trebuchet MS, sans-serif">TOTAL</text>
    <text x="266" y="266" text-anchor="end" font-size="31" font-weight="700" fill="#c1121f" font-family="Trebuchet MS, sans-serif">$178</text>
  </g>

  <!-- shocked customer -->
  <g transform="translate(600,300)">
    <circle cx="60" cy="60" r="46" fill="#f0c987" stroke="#1d1b16" stroke-width="7"/>
    <circle cx="44" cy="52" r="7" fill="#1d1b16"/>
    <circle cx="78" cy="52" r="7" fill="#1d1b16"/>
    <ellipse cx="61" cy="82" rx="15" ry="19" fill="#1d1b16"/>
    <text x="140" y="58" font-size="52" font-weight="700" fill="#c1121f"
          font-family="Trebuchet MS, sans-serif">!</text>
  </g>
</svg>
<p class="line">It said it was finished. My customer got charged <em>twice</em>.</p>
</div>
</body>
</html>
